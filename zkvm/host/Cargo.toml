[package]
name = "host"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
default-run = "host"

[dependencies]
methods = { path = "../methods" }
zkmob-core = { path = "../core" }
risc0-zkvm = { version = "^3.0.6" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = "1.0"
serde_json = "1"
sha2 = "0.10"
bincode = "1.3"
ring = "0.17.14"
zeroize = "1.9"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
libc = "0.2" # killpg for the prover process group
ml-dsa = "0.1.1"

[features]
# Explicit opt-in for subprocess crash tests; absent from normal builds.
fault-injection = []
